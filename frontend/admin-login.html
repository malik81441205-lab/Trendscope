<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendScope Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Cpath d='M6 22 L12 14 L18 18 L26 8' stroke='%234ade80' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M22 8 L26 8 L26 12' stroke='%234ade80' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg-deep: #050505;
            --neon-green: #00ff88;
            --neon-green-glow: rgba(0, 255, 136, 0.4);
            --neon-green-dim: rgba(0, 255, 136, 0.1);
            --card-bg: rgba(15, 15, 18, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg-deep); 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main);
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }

        /* Ambient Background */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 80% 20%, var(--neon-green-dim) 0%, transparent 40%),
                        radial-gradient(circle at 20% 80%, rgba(0, 100, 255, 0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Particles */
        .particles-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
        }

        /* Layout Structure */
        .auth-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10;
        }
        
        /* Left Side - Login */
        .auth-left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            z-index: 10;
            max-width: 100%;
        }

        /* Right Side - Realistic Dashboard Simulation */
        .auth-right {
            flex: 1.2;
            position: relative;
            display: none;
            border-left: 1px solid var(--border-color);
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(20px);
            padding: 40px;
            overflow: hidden;
            flex-direction: column;
            gap: 24px;
        }
        
        @media (min-width: 900px) {
            .auth-right { display: flex; }
            .auth-left { max-width: 500px; flex: none; width: 500px; }
        }
        @media (min-width: 1200px) {
            .auth-left { max-width: 600px; width: 600px; }
        }

        /* ─── PREMIUM LOGIN CARD ─── */
        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 48px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(40px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        /* Mouse Reactive Glow Effect */
        .auth-card::before {
            content: '';
            position: absolute;
            top: var(--mouse-y, -1000px);
            left: var(--mouse-x, -1000px);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, transparent 60%);
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            position: relative;
            z-index: 10;
            text-align: left;
            margin-bottom: 48px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            color: var(--neon-green);
            font-size: 11px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }

        .status-dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
        }

        /* ─── FLOATING INPUT FIELDS ─── */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 28px;
            position: relative;
            z-index: 10;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .form-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--neon-green);
            background: rgba(0, 255, 136, 0.02);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 0 4px rgba(0, 255, 136, 0.1);
        }

        .form-label {
            position: absolute;
            left: 48px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: #71717a;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            padding: 0 4px;
        }

        .form-input:focus ~ .form-label,
        .form-input:not(:placeholder-shown) ~ .form-label {
            top: 0;
            font-size: 12px;
            color: var(--neon-green);
            background: #111114; /* Match card bg approx */
            border-radius: 4px;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #71717a;
            transition: color 0.3s;
        }

        .form-input:focus ~ .input-icon {
            color: var(--neon-green);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #71717a;
            cursor: pointer;
            transition: color 0.2s;
            padding: 4px;
        }
        .password-toggle:hover { color: white; }

        /* ─── PREMIUM BUTTON ─── */
        .submit-btn {
            position: relative;
            padding: 18px;
            border-radius: 12px;
            background: transparent;
            color: var(--neon-green);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid var(--neon-green);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.4), transparent);
            transition: all 0.6s ease;
        }

        .submit-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4), 0 0 10px rgba(0, 255, 136, 0.2);
            transform: translateY(-2px);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .spinner {
            display: none;
            width: 20px; height: 20px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .submit-btn.loading {
            background: rgba(0, 255, 136, 0.1);
            color: transparent;
            pointer-events: none;
            border-color: rgba(0, 255, 136, 0.3);
        }
        .submit-btn.loading .spinner {
            display: block;
            position: absolute;
            color: var(--neon-green);
        }

        .auth-footer {
            position: relative;
            z-index: 10;
            text-align: left;
            margin-top: 36px;
            font-size: 13px;
            color: #52525b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
        }
        .auth-footer a {
            color: var(--text-muted);
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .auth-footer a:hover {
            color: white;
        }

        #error-msg {
            color: #ff4444;
            font-size: 13px;
            font-weight: 500;
            display: none;
            background: rgba(255, 68, 68, 0.1);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 68, 68, 0.2);
            margin-bottom: 24px;
            position: relative;
            z-index: 10;
        }

        /* ─── REALISTIC DASHBOARD SIMULATION ─── */
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
        }
        .dash-live-badge {
            font-size: 12px;
            color: var(--neon-green);
            background: rgba(0, 255, 136, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
        }

        .dash-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .dash-widget {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .dash-widget::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            opacity: 0.3;
        }
        .widget-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .widget-value { font-size: 28px; color: white; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
        .widget-change { font-size: 12px; color: var(--neon-green); display: flex; align-items: center; gap: 4px; }

        .dash-chart-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .dash-svg-chart {
            width: 100%;
            height: 100%;
            flex: 1;
            margin-top: 16px;
        }
        
        .anim-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 4s linear infinite forwards;
        }
        @keyframes dash {
            0% { stroke-dashoffset: 1000; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -1000; }
        }

        .dash-logs {
            height: 140px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        .log-track {
            position: absolute;
            top: 0; left: 0; width: 100%;
            animation: scrollLogs 20s linear infinite;
        }
        .log-item {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            display: flex;
            gap: 16px;
            color: #a1a1aa;
        }
        .log-time { color: #52525b; font-family: monospace; }
        .log-event { color: white; }
        .log-status { color: var(--neon-green); }

        @keyframes scrollLogs {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); } /* Scrolls half to loop seamlessly if duplicated */
        }

    </style>
</head>

<body>
    <div class="ambient-bg"></div>
    <canvas class="particles-container" id="particles"></canvas>

    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="auth-card" id="card">
                <div class="auth-header">
                    <div class="status-badge">
                        <div class="status-dot"></div>
                        Live Trend Activity
                    </div>
                    <h1 class="title">Command Center</h1>
                    <p class="subtitle">Authenticate to access realtime analytics and creator intelligence.</p>
                </div>

                <div id="error-msg"></div>

                <form class="auth-form" id="admin-login-form">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" class="form-input" id="email" placeholder=" " required autocomplete="off">
                        <label class="form-label" for="email">Admin Email</label>
                    </div>

                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" class="form-input" id="password" placeholder=" " required>
                        <label class="form-label" for="password">Admin Password</label>
                        <svg class="password-toggle" id="toggle-pw" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-btn">
                        <span id="btn-text">LAUNCH DASHBOARD</span>
                        <div class="spinner"></div>
                    </button>
                </form>

                <div class="auth-footer">
                    <span>Global Trend Tracking</span>
                    <a href="login.html">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        Abort
                    </a>
                </div>
            </div>
        </div>

        <div class="auth-right">
            <div class="dash-header">
                TRENDSCOPE AI ENGINE
                <div class="dash-live-badge">
                    <div class="status-dot" style="animation-duration: 1s;"></div>
                    LIVE DATA
                </div>
            </div>

            <div class="dash-grid">
                <div class="dash-widget">
                    <div class="widget-title">Viral Momentum</div>
                    <div class="widget-value">24.8M</div>
                    <div class="widget-change">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
                        +14.2% / hr
                    </div>
                </div>
                <div class="dash-widget">
                    <div class="widget-title">Trending Today</div>
                    <div class="widget-value">1,402</div>
                    <div class="widget-change">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
                        Optimal
                    </div>
                </div>
                <div class="dash-widget">
                    <div class="widget-title">Engagement Velocity</div>
                    <div class="widget-value" style="color: var(--neon-green);">+84%</div>
                    <div class="widget-change" style="color: var(--neon-green);">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
                        Accelerating
                    </div>
                </div>
            </div>

            <div class="dash-chart-container">
                <div class="widget-title">Audience Activity</div>
                <svg class="dash-svg-chart" viewBox="0 0 500 150" preserveAspectRatio="none">
                    <!-- Grid Lines -->
                    <line x1="0" y1="50" x2="500" y2="50" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                    <line x1="0" y1="100" x2="500" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                    <!-- Area fill -->
                    <path d="M0,150 L0,100 Q50,50 100,110 T200,80 T300,120 T400,60 T500,20 L500,150 Z" fill="url(#grad)" opacity="0.5"/>
                    <!-- Animated Line -->
                    <path class="anim-line" d="M0,100 Q50,50 100,110 T200,80 T300,120 T400,60 T500,20" fill="none" stroke="var(--neon-green)" stroke-width="3" stroke-linecap="round"/>
                    
                    <defs>
                        <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="var(--neon-green)" stop-opacity="0.3"/>
                            <stop offset="100%" stop-color="var(--neon-green)" stop-opacity="0"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <div class="dash-logs">
                <div class="log-track" id="log-track">
                    <!-- Generated via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mouse Reactive Card Glow
        const card = document.getElementById('card');
        document.addEventListener('mousemove', e => {
            if(!card) return;
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });

        // Generate Fake Security Logs
        const logTrack = document.getElementById('log-track');
        const events = ["New Viral Trend Detected", "Audience Spike in Gaming", "Engagement Velocity High", "Creator Added to Watchlist", "Regional Trending Shift"];
        let logHTML = '';
        for(let i=0; i<15; i++) {
            const time = new Date(Date.now() - Math.random() * 1000000).toISOString().split('T')[1].slice(0,8);
            const evt = events[Math.floor(Math.random() * events.length)];
            logHTML += `<div class="log-item"><span class="log-time">[${time}]</span><span class="log-event">${evt}</span><span class="log-status" style="color:var(--neon-green); margin-left:auto;">TRACKING</span></div>`;
        }
        logTrack.innerHTML = logHTML + logHTML; // Duplicate for smooth looping

        // Simple Particles Background (Mobile Optimized)
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particlesArray = [];
        const isMobile = window.innerWidth < 768;
        const particleCount = isMobile ? 15 : 50; // Reduce on mobile

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * -0.5 - 0.1;
                this.opacity = Math.random() * 0.5;
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(0, 255, 136, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < particleCount; i++) particlesArray.push(new Particle());
        
        let animationId;
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            animationId = requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Password Toggle
        const togglePw = document.getElementById('toggle-pw');
        const pwInput = document.getElementById('password');
        togglePw.addEventListener('click', () => {
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                togglePw.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                pwInput.type = 'password';
                togglePw.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        });

        function showError(msg) {
            const errEl = document.getElementById('error-msg');
            errEl.textContent = msg;
            errEl.style.display = 'block';
        }

        // Login Submit
        document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            
            document.getElementById('error-msg').style.display = 'none';

            const btn = document.getElementById('submit-btn');
            btn.classList.add('loading');
            
            try {
                const res = await fetch("/api/admin-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("admin", JSON.stringify(data.admin));
                    window.location.href = "admin.html";
                } else {
                    showError(data.error || "Authentication failed");
                    btn.classList.remove('loading');
                }
            } catch (err) {
                showError("Server connection failed. Please try again later.");
                btn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
